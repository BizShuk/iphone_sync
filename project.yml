name: iPhoneSync

options:
  bundleIdPrefix: com.shuk
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: F3G9SMLJU6
    CODE_SIGN_STYLE: Automatic

packages:
  SyncCore:
    path: packages/SyncCore

targets:
  iPhoneSyncIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: apps/ios/Sources
      - path: apps/ios/Shared
    info:
      path: apps/ios/Info.plist
      properties:
        CFBundleDisplayName: iPhone Sync
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 出口合規：傳檔通道的加密全部由 OS 提供（Network.framework TLS 1.2 PSK、
        # CryptoKit Curve25519 / SHA-256 / HKDF、Security.framework Keychain），
        # 專案未自行實作任何演算法，符合 EAR Category 5 Part 2 豁免。
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.shuk.iphonesync.sync
            CFBundleURLSchemes:
              - iphonesync
        BGTaskSchedulerPermittedIdentifiers:
          - com.shuk.iphonesync.ios.scheduled-sync
          - com.shuk.iphonesync.ios.scheduled-sync.debug
        LSRequiresIPhoneOS: true
        NSBonjourServices:
          - _iphonesync._tcp
          - _iphonesync-pair._tcp
        NSLocalNetworkUsageDescription: Find your Mac and transfer original photo resources on this local network.
        NSPhotoLibraryUsageDescription: Select albums, back up their original resources, and optionally delete fully backed-up photos after confirmation.
        UILaunchScreen: {}
        UIBackgroundModes:
          - processing
        UIRequiredDeviceCapabilities:
          - arm64
          - wifi
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: apps/ios/iPhoneSync.entitlements
    dependencies:
      - package: SyncCore
        product: SyncCore
      - target: iPhoneSyncControlCenter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuk.iphonesync.ios
        PRODUCT_NAME: iPhone Sync
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: apps/ios/iPhoneSync.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: 1

  iPhoneSyncControlCenter:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: apps/ios/ControlCenter
      - path: apps/ios/Shared
    info:
      path: apps/ios/ControlCenter/Info.plist
      properties:
        # App Store 要求內嵌 extension 必須自帶 CFBundleDisplayName（ITMS-90360）。
        CFBundleDisplayName: iPhone Sync Control
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          # Control Center controls 是 WidgetKit extension 內的 ControlWidget，
          # 沒有 Control Center 專屬的 extension point。用 controlcenter-widget-extension
          # 可以建置與本機安裝，但上傳會被 ITMS-90349 擋下。
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuk.iphonesync.ios.controlcenter
        PRODUCT_NAME: iPhone Sync Control
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        # 內嵌 extension 的 device family 不得超出 container app（iPhone-only）。
        TARGETED_DEVICE_FAMILY: 1

  iPhoneSyncMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: apps/macos/Sources
    info:
      path: apps/macos/Info.plist
      properties:
        CFBundleDisplayName: iPhone Sync
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 與 iOS 端同一條傳檔通道、同一組系統加密框架；為 Mac App Store 預先宣告。
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSBonjourServices:
          - _iphonesync._tcp
          - _iphonesync-pair._tcp
        NSLocalNetworkUsageDescription: Find and receive original photo resources from your paired iPhone on this local network.
        NSPrincipalClass: NSApplication
    entitlements:
      path: apps/macos/iPhoneSyncMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    dependencies:
      - package: SyncCore
        product: SyncCore
      - package: SyncCore
        product: MacReceiverKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuk.iphonesync.mac
        PRODUCT_NAME: iPhone Sync
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: apps/macos/iPhoneSyncMac.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2

  iPhoneSyncIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: apps/ios/Tests
    dependencies:
      - target: iPhoneSyncIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuk.iphonesync.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iPhone Sync.app/iPhone Sync"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: 1

schemes:
  iPhoneSyncIOS:
    build:
      targets:
        iPhoneSyncIOS: all
        iPhoneSyncControlCenter: all
        iPhoneSyncIOSTests: [test]
    test:
      targets:
        - iPhoneSyncIOSTests
