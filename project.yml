name: iPhoneSync

options:
  bundleIdPrefix: com.bizshuk
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""

packages:
  SyncCore:
    path: packages/SyncCore

targets:
  iPhoneSyncIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: apps/ios/Sources
    info:
      path: apps/ios/Info.plist
      properties:
        CFBundleDisplayName: iPhone Sync
        BGTaskSchedulerPermittedIdentifiers:
          - com.bizshuk.iphonesync.ios.scheduled-sync
        LSRequiresIPhoneOS: true
        NSBonjourServices:
          - _iphonesync._tcp
          - _iphonesync-pair._tcp
        NSLocalNetworkUsageDescription: Find your Mac and transfer original photo resources on this local network.
        NSPhotoLibraryUsageDescription: Select one or more albums and back up their original resources to your paired Mac.
        UILaunchScreen: {}
        UIBackgroundModes:
          - processing
        UIRequiredDeviceCapabilities:
          - arm64
          - wifi
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: apps/ios/iPhoneSync.entitlements
    dependencies:
      - package: SyncCore
        product: SyncCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bizshuk.iphonesync.ios
        PRODUCT_NAME: iPhone Sync
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: apps/ios/iPhoneSync.entitlements
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1

  iPhoneSyncMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: apps/macos/Sources
    info:
      path: apps/macos/Info.plist
      properties:
        CFBundleDisplayName: iPhone Sync
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSBonjourServices:
          - _iphonesync._tcp
          - _iphonesync-pair._tcp
        NSLocalNetworkUsageDescription: Find and receive original photo resources from your paired iPhone on this local network.
        NSPrincipalClass: NSApplication
    entitlements:
      path: apps/macos/iPhoneSyncMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    dependencies:
      - package: SyncCore
        product: SyncCore
      - package: SyncCore
        product: MacReceiverKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuk.iphonesync.mac
        PRODUCT_NAME: iPhone Sync
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: apps/macos/iPhoneSyncMac.entitlements
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1

  iPhoneSyncIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: apps/ios/Tests
    dependencies:
      - target: iPhoneSyncIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bizshuk.iphonesync.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iPhone Sync.app/iPhone Sync"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  iPhoneSyncIOS:
    build:
      targets:
        iPhoneSyncIOS: all
        iPhoneSyncIOSTests: [test]
    test:
      targets:
        - iPhoneSyncIOSTests
