name: Release Desktop Receivers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (defaults to manual-<run number> if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # 先把 release 建好, 兩個 build job 再各自把自己的 artifact 直接 upload 上去.
  # 不經過 actions/upload-artifact —— 那條路徑會吃 artifact storage quota,
  # quota 滿了就整條 release 失敗 (v0.0.13 ~ v0.0.32 全部卡在這裡).
  prepare:
    name: Create or reuse the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve tag name
        id: resolve
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ github.event.inputs.tag }}"
            [ -n "$tag" ] || tag="manual-${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; reusing it"
            exit 0
          fi
          draft_flag=""
          [ "$GITHUB_EVENT_NAME" = "push" ] || draft_flag="--draft"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $draft_flag

  macos:
    name: SyncCore tests + iPhoneSyncMac (DMG + PKG)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run SyncCore package tests
        run: swift test --package-path packages/SyncCore

      # Ad-hoc signed by default. Add repo secrets and export them here as
      # MAC_SIGN_IDENTITY / MAC_INSTALLER_IDENTITY / MAC_NOTARY_APPLE_ID /
      # MAC_NOTARY_TEAM_ID / MAC_NOTARY_PASSWORD (plus a keychain import step
      # for the Developer ID certificates) to switch the same script to
      # Developer ID signing + notarization. See
      # .claude/skills/os-packaging/references/macos.md.
      - name: Package DMG + PKG
        env:
          MAC_BUILD_NUMBER: ${{ github.run_number }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version_flag=""
          case "$TAG" in
            v[0-9]*) version_flag="--version ${TAG#v}" ;;
          esac
          bash scripts/package-mac.sh $version_flag

      # 網站直接連 /releases/latest/download/<name>, 所以檔名必須是`不含版號`的固定值.
      - name: Normalize asset names
        run: |
          cd build/mac-dist
          mv -- *.dmg iPhoneSync-Mac.dmg
          mv -- *.pkg iPhoneSync-Mac.pkg
          ls -l

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            build/mac-dist/iPhoneSync-Mac.dmg \
            build/mac-dist/iPhoneSync-Mac.pkg \
            --clobber

  windows:
    name: SyncCore.Windows + electron-builder (NSIS + portable)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: |
            packages/SyncCore.Windows/package-lock.json
            apps/windows/package-lock.json

      - name: Install + test + build SyncCore.Windows
        shell: pwsh
        run: |
          cd packages/SyncCore.Windows
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Install + build apps/windows
        shell: pwsh
        run: |
          cd apps/windows
          npm ci --no-audit --no-fund
          npm run build

      - name: Copy SyncCore.Windows dist into apps/windows/node_modules
        shell: pwsh
        run: |
          cd apps/windows
          node scripts/copy-sync-core.js

      - name: Stamp release version from tag
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ($env:TAG -match '^v[0-9]') {
            cd apps/windows
            $version = $env:TAG -replace '^v', ''
            npm version $version --no-git-tag-version --allow-same-version
          }

      - name: Produce NSIS installer + portable .exe
        shell: pwsh
        run: |
          cd apps/windows
          npm run dist

      # 同上: 固定檔名, 讓 /releases/latest/download/ 永遠指得到.
      - name: Normalize asset names
        shell: pwsh
        run: |
          cd apps/windows/dist-installer
          Move-Item -Force (Get-ChildItem iPhoneSync-Setup-*.exe)[0].FullName iPhoneSync-Setup.exe
          Move-Item -Force (Get-ChildItem iPhoneSync-Portable-*.exe)[0].FullName iPhoneSync-Portable.exe
          Get-ChildItem *.exe

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload $env:TAG `
            apps/windows/dist-installer/iPhoneSync-Setup.exe `
            apps/windows/dist-installer/iPhoneSync-Portable.exe `
            --clobber
