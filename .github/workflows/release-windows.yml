name: Build Windows 11 Receiver

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (defaults to the trigger commit SHA short if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: SyncCore.Windows + electron-builder (NSIS + portable)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: |
            packages/SyncCore.Windows/package-lock.json
            apps/windows/package-lock.json

      - name: Install + test + build SyncCore.Windows
        shell: pwsh
        run: |
          cd packages/SyncCore.Windows
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Install + build apps/windows
        shell: pwsh
        run: |
          cd apps/windows
          npm ci --no-audit --no-fund
          npm run build

      - name: Copy SyncCore.Windows dist into apps/windows/node_modules
        shell: pwsh
        run: |
          cd apps/windows
          node scripts/copy-sync-core.js

      - name: Produce NSIS installer + portable .exe
        shell: pwsh
        run: |
          cd apps/windows
          npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneSync-Windows-x64
          path: |
            apps/windows/dist-installer/win-unpacked/**/*
            apps/windows/dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/windows/dist-installer/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish draft GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || format('manual-{0}', github.run_number) }}
          files: |
            apps/windows/dist-installer/*.exe
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
