<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone Sync Pairing</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="pairing-body">
  <main class="pairing-root">
    <h1 class="pairing-title">Pairing code</h1>
    <div class="pairing-code" id="pairing-code">------</div>
    <div class="pairing-meta" id="pairing-meta">2:00 remaining</div>
    <p class="pairing-hint">Enter this code on the iPhone. The code stays on the local network; it is never sent over the Internet.</p>
  </main>
  <script src="pairing.js" type="module"></script>
</body>
</html>
