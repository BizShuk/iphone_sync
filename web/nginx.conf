# web/nginx.conf — 掛成容器內的 /etc/nginx/conf.d/default.conf。
#
# 這顆容器只端出一份文件: web/index.html。它`不是`對外入口——
# 外面進來的是 hosts/liva 的 nginx (443, Host 分流), 這裡只是那條路的終點,
# 所以沒有 TLS, 沒有 rate limit, 也沒有 real IP 還原: 那三件事屬於入口那一層。
#
# 8321 與 compose 的 ports: 是同一個數字 (port-usage: 身分在 host 與 container
# 兩側必須一致)。改號要兩邊一起改, 只改一邊會得到一個轉發到黑洞的 hostname。
server {
    listen      8321;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # 頁面是單一 HTML, 圖片以 data URI 內嵌, 字型走 Google Fonts CDN——
    # 這裡沒有第二個資產要服務, 因此任何路徑都回同一頁, 不吐目錄清單也不吐 404。
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # 上游 nginx 與 rollout 驗證用得到; 不落 access log, 否則探測把真正的請求淹掉。
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
